[project]
name = "wlasl"
version = "0.1.0"
description = "WLASL 手語辨識共用套件：關鍵點擷取、資料集、模型、訓練與匯出"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    # Kaggle 與本機必須同一版，否則關鍵點分布會偏移
    "mediapipe==1.1.0",
]

[project.optional-dependencies]
# 本機驗證與推論：CUDA / cuDNN 由 pip wheel 提供，不必裝系統 CUDA Toolkit
eval = [
    # 1.27 起 [cuda] 改拉 CUDA 13 套件，nvidia-cublas 13 沒有 Windows wheel；1.26 是最後一版 cu12
    "onnxruntime-gpu[cuda,cudnn]==1.26.0; python_version >= '3.11'",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wlasl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
